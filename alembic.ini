# A friendly reminder to the user: please ensure your DATABASE_URL in .env
# or Fly.io secrets starts with 'postgresql+asyncpg://' for this to work.

[alembic]
# A path to the Alembic script directory, relative to the current path.
script_location = alembic

# The database URL.
# This value is primarily a fallback for local use. In production and in the
# env.py script, the URL from your config/settings.py (loaded from .env)
# will take precedence.
sqlalchemy.url = sqlite+aiosqlite:///./data/eido_sentinel_local.db

# Template for new migration files.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# You can enable hooks to automatically format your migration files.
# For example, if you use 'black':
# hooks = black
# black.type = exec
# black.entrypoint = black
# black.options = -l 88 %(path)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S