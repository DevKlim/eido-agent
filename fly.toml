# ./fly.toml

# This file defines the configuration for the API backend service.
# It MUST be committed to your GitHub repository for Fly.io to build the app.

# Replace "eido-sentinel-api" with the name of your app on Fly.io.
app = "eido-sentinel-api"
# Replace "sjc" with the primary region you selected for your app.
primary_region = "sjc"

[build]
  # No extra build arguments are needed; Fly will use the Dockerfile by default.

# This section tells Fly how to handle incoming web traffic.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0 # Set to 0 for free tier to allow machines to sleep.
  processes = ["app"]

# This section mounts the persistent volume we created for the SQLite database.
[mounts]
  source = "eido_data"
  destination = "/app/data"