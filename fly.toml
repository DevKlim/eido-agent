# Replace "eido-agent" with your actual app name
app = "eido-agent"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

# This section tells Fly.io what command to run to start your application.
# It is more explicit and reliable than relying on Dockerfile's CMD alone.
[processes]
  web = "uvicorn api.main:app --host 0.0.0.0 --port 8000 --log-level info"

# This section configures networking and health checks.
[[services]]
  # This section defines how to handle public traffic.
  protocol = "tcp"
  internal_port = 8000 # The port your app listens on inside the container.
  processes = ["web"]  # Route traffic to our "web" process defined above.

  # This section defines how fly-proxy forwards requests.
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  # This section defines the public-facing ports.
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # This section defines how to check if your application is healthy.
  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "20s" # Increased grace period to give the app time to start.
    method = "GET"
    path = "/" # The root path ("/") is a good, lightweight check.
    protocol = "http"