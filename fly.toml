# ./fly.toml (for the API)

app = "eido-sentinel-api" # Use the app name you chose
primary_region = "sjc"  # Use the region you chose

[build]
  # No build args needed, Dockerfile is self-contained

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0 # Set to 1 if you want it always on, 0 for free tier sleep
  processes = ["app"]

# Mount the persistent volume to the /app/data directory
# This is where your SQLite DB and geocoding JSON will live.
[mounts]
  source = "eido_data"
  destination = "/app/data"

# The 'app' process is the default command from the Dockerfile's CMD
# which is to run the 'api'.
[[processes]]
  app = "api"

# Health checks to ensure the API is running correctly
[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    method = "get"
    path = "/" # Check the static landing page endpoint