# Fly.io app configuration for EIDO Sentinel
# See https://fly.io/docs/reference/configuration/ for more information

app = "eido-sentinel" # Replace with your actual app name on Fly.io
primary_region = "sjc" # Choose a region close to you
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

# This command runs once per deployment to handle tasks like database migrations.
# For now, we're using SQLAlchemy's create_all on startup, but for production
# a real migration tool like Alembic is recommended. You can remove this section
# if you are not using Alembic.
[deploy]
  release_command = "alembic upgrade head"

# Environment variables applied to ALL processes.
[env]
  # Set the app's public URL. Fly provides this automatically.
  API_BASE_URL = "https://eido-sentinel.fly.dev" # Replace with your app's URL
  # Tell the UI where its own public URL is. This is needed for CORS.
  STREAMLIT_APP_URL = "http://eido-sentinel.fly.dev:8080" # Replace with your app's URL and the UI port
  LOG_LEVEL = "INFO"

# The `api` service handles the backend and the main landing page.
# It is exposed on standard HTTP/HTTPS ports.
[[services]]
  protocol = "tcp"
  internal_port = 8000 # The port our FastAPI app listens on inside the container
  processes = ["api"]  # Corresponds to the `api` process in entrypoint.sh

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/" # The landing page should return 200 OK
    protocol = "http"

# The `ui` service handles the Streamlit frontend.
# It runs on a different public port.
[[services]]
  protocol = "tcp"
  internal_port = 8501 # The port our Streamlit app listens on inside the container
  processes = ["ui"]   # Corresponds to the `ui` process in entrypoint.sh

  [services.concurrency]
    type = "connections"
    hard_limit = 20
    soft_limit = 15

  [[services.ports]]
    port = 8080 # The single public port for the UI
    handlers = ["http", "tls"] # Fly will handle HTTP and TLS termination on this port

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz" # Streamlit's built-in health endpoint
    protocol = "http"